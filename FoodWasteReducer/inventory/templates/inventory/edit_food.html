{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Food Item - Food Waste Reducer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0fdf4;
        }
        .title-font {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="bg-green-800 text-white shadow-lg">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <img src="{% static 'images/logo-White.png' %}" alt="Logo" class="h-10 w-10">
                    <h1 class="title-font text-xl md:text-2xl font-bold">Food Waste Reducer</h1>
                </div>
                <div class="flex items-center space-x-6">
                    {% if request.user.is_authenticated %}
                    <span class="hidden md:block text-green-100">Hi, {{ request.user.username }} 👋</span>
                    <a href="{% url 'logout' %}" class="bg-green-700 hover:bg-green-600 px-4 py-2 rounded-lg flex items-center space-x-1 transition">
                        <span>Logout</span>
                    </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </header>

    <!-- Main Form -->
    <main class="container mx-auto px-4 py-8 max-w-2xl">
        <div class="bg-white rounded-xl shadow-md p-6">
            <h2 class="text-2xl font-bold title-font mb-4">Edit Food Item</h2>
            <form method="POST">
                {% csrf_token %}

                <!-- Name -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Food Name*</label>
                    <input type="text" name="name" value="{{ item.name }}" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                </div>

                <!-- Quantity -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Quantity*</label>
                    <input type="number" name="quantity" min="1" value="{{ item.quantity }}" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                </div>

                <!-- Category -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Category*</label>
                    <select name="category" class="w-full px-4 py-2 border border-gray-300 rounded-lg" required>
                        {% for key, label in item.CATEGORY_CHOICES %}
                        <option value="{{ key }}" {% if item.category == key %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Expiry Date -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Expiry Date*</label>
                    <input type="date" name="expiry_date" value="{{ item.expiry_date }}" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                </div>

                <!-- Actions -->
                <div class="flex justify-between">
                    <a href="{% url 'dashboard' %}" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-100">Cancel</a>
                    <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">Update</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
